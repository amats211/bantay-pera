<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bantay Pera</title>
<meta name="theme-color" content="#2B57A0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--ink:#17202B;--muted:#5B6777;--line:#D8DEE6;
  --blue:#2B57A0;--gold:#A87A1F;--red:#B23D36;--green:#27704B;
  --redbg:#F7E4E2;--greenbg:#E1EFE6;--goldbg:#F6EDD9;--bluebg:#E3EAF6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11161E;--surface:#1A222D;--ink:#E7EBF1;--muted:#9AA5B4;--line:#2B3543;
    --blue:#86A8E8;--gold:#E2B65C;--red:#EF857C;--green:#71C696;
    --redbg:#3A2324;--greenbg:#1B3226;--goldbg:#372D19;--bluebg:#1D2A40;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.num,b,.amt{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{padding:18px 18px 6px;max-width:560px;margin:0 auto}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em;font-weight:750}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{max-width:560px;margin:0 auto;padding:6px 14px 20px}
section{margin:12px 0}
h2{font-size:18px;margin:0}
h3{font-size:15px;margin:0 0 8px;font-weight:650}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav button{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:36px;font-size:18px}
/* hero: the month's money race */
.hero{background:var(--surface);border-radius:18px;padding:16px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row span{color:var(--muted);font-size:13px}
.row b{font-size:17px}
.bar{height:14px;background:var(--bg);border-radius:7px;overflow:hidden;display:flex;margin:6px 0 12px}
.seg{display:block;height:100%}
.seg.in{background:var(--green)}
.seg.out{background:var(--red)}
.seg.due{background:repeating-linear-gradient(45deg,var(--red) 0 5px,transparent 5px 9px);opacity:.75}
.verdict{margin:4px 0 0;font-size:20px;font-weight:700;line-height:1.25}
.verdict.good{color:var(--green)}
.verdict.bad{color:var(--red)}
.verdict small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.callout{border-left:4px solid var(--gold);background:var(--goldbg);border-radius:10px;padding:12px 14px}
.callout.red{border-color:var(--red);background:var(--redbg)}
.callout.green{border-color:var(--green);background:var(--greenbg)}
.callout p{margin:0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .main{flex:1;min-width:0}
.list .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .meta{font-size:12px;color:var(--muted)}
.list .amt{font-weight:650;white-space:nowrap}
.list li.done .name,.list li.done .amt{color:var(--muted);text-decoration:line-through}
.day{min-width:38px;text-align:center;font-size:11px;color:var(--muted);line-height:1.1}
.day b{display:block;font-size:17px;color:var(--ink)}
.day.late b{color:var(--red)}
.pos{color:var(--green)}.neg{color:var(--red)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0f1620}}
.btn.small{padding:5px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn.wide{width:100%;padding:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:16px}
.stat input{width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:750;font-size:16px;color:var(--green)}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin-bottom:8px}
.cat .track{grid-column:1/-1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--red)}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg-toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg-toggle button{border:0;background:var(--surface);padding:10px;font-weight:600}
.seg-toggle button[aria-pressed="true"].in{background:var(--green);color:#fff}
.seg-toggle button[aria-pressed="true"].out{background:var(--red);color:#fff}
.seg-toggle button[aria-pressed="true"].neutral{background:var(--ink);color:var(--surface)}
.groupname{font-size:12px;color:var(--muted);margin:14px 0 2px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
.tabs button[aria-current="page"]{color:var(--blue);background:var(--bluebg)}
.tabs svg{display:block;margin:0 auto 2px;width:20px;height:20px}
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dlg{padding:18px}
.dlg h2{margin-bottom:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .grow{flex:1}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw}
#toast.show{opacity:1}
.big{font-size:28px;font-weight:750;letter-spacing:-.01em}
.scen{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px;align-items:baseline}
.scen .h{font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tabs{grid-template-columns:repeat(6,1fr)}
.tabs button{font-size:11px;padding:8px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gear{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.acct{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.acct:last-of-type{border-bottom:0}
.acct .k{font-size:12px;color:var(--muted)}
.acct b{font-size:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:2px solid var(--ink)}
.total b{font-size:22px}
.goal{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.goal i{display:block;height:100%;background:var(--gold)}
.daynav{display:flex;gap:8px;align-items:center}
.daynav input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.daynav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:38px;font-size:18px}
.btnrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btnrow .btn{padding:10px 6px;font-size:13px}
.pl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.pl .t{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.techrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.techrow:last-child{border-bottom:0}
.techrow .meta{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;color:var(--muted);font-weight:600;font-size:12px;padding:4px 0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chips.scroll .chip{white-space:nowrap}
.preview{background:var(--bluebg);border-radius:10px;padding:10px 12px;font-size:14px;margin:-2px 0 12px}
</style>
</head>
<body>
<header class="top">
  <div><h1>Bantay Pera</h1><p id="sub">Personal, shop and online money in one place.</p></div>
  <button class="gear" id="gear">Settings</button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='bantay-pera-v1';
const BORROWED='Borrowed (card/loan)';
const DRAW='Owner draw';
const BOOKCATS={
  me:{in:['Salary',DRAW,'Side income',BORROWED,'Other in'],
      out:['Food','Transport','Utilities','Bills','Subscriptions','Debt payment','Family','Load & data','Personal','Other out']},
  fk:{in:['Repair job','Accessories sales','Other shop income',BORROWED],
      out:['Parts','Parts delivery','Tech pay','Rent','Utilities','Internet','Permits & fees','Software & tools','Supplies',DRAW,'Other shop expense']},
  ct:{in:['Winbliter8 activations','Kurso.ph courses','Other online income',BORROWED],
      out:['Hosting & domain','Software & tools','Ads',DRAW,'Other']}
};
const GENERIC={in:['Sales','Other income',BORROWED],out:['Supplies','Software & tools','Other expense',DRAW]};
const ACCT_KINDS={cash:'Cash',bank:'Bank',ewallet:'E-wallet',reserve:'Emergency reserve'};
const FREQ={monthly:'Monthly',quarterly:'Every 3 months',yearly:'Yearly'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function defaults(){return{
  v:2,goalFix:true,routes:[],
  accounts:[
    {id:'cash',name:'Cash on hand',kind:'cash',opening:0,goal:0},
    {id:'drawer',name:'Shop drawer',kind:'cash',opening:0,goal:0},
    {id:'gcash',name:'GCash',kind:'ewallet',opening:0,goal:0},
    {id:'bank',name:'Bank',kind:'bank',opening:0,goal:0},
    {id:'reserve',name:'Emergency fund',kind:'reserve',opening:0,goal:0}],
  books:[{id:'me',name:'Personal'},{id:'fk',name:'FoneKingdom'},{id:'ct',name:'Confident Tech'}],
  techs:[
    {id:'owner',name:'Me',pct:0,allow:0,rule:'none',owner:true},
    {id:'lester',name:'Lester',pct:40,allow:300,rule:'manual'},
    {id:'eder',name:'Eder',pct:20,allow:200,rule:'always'}],
  shop:{base:'net',delivery:150},
  tx:[],bills:[],debts:[],paid:{},
  plan:{extra:0,method:'avalanche'},
  invest:{jar:0,daily:100,minComm:20,rate:6,years:20,holdings:[]}
}}
let S=defaults();
let tab='home',prevTab='home';
let period='month',viewMonth=monthKey(todayISO()),homeBook='all',logBook='all',billBook='all',shopDay=todayISO();

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return iso(new Date())}
function monthKey(s){return s.slice(0,7)}
function shiftDay(s,n){const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){const n=parseFloat(String(v).replace(/[,₱\s]/g,''));return isFinite(n)?n:0}
function peso(n,dec){const neg=n<0;const s=Math.abs(n).toLocaleString('en-PH',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});return(neg?'−':'')+'₱'+s}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthLabel(m){const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'})}
function dayLabel(s){return new Date(s+'T00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})}
function shiftMonth(m,d){const[y,mo]=m.split('-').map(Number);const t=new Date(y,mo-1+d,1);return t.getFullYear()+'-'+pad(t.getMonth()+1)}
function sum(a,f){return a.reduce((s,x)=>s+(f?f(x):x),0)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function cats(book,type){return(BOOKCATS[book]||GENERIC)[type]}
function bookName(id){return(S.books.find(b=>b.id===id)||{name:id}).name}
function acctName(id){if(id==='card')return'Credit card';if(String(id).startsWith('card:')){const d=S.debts.find(x=>x.id===id.slice(5));return d?(d.bank?d.bank+' ':'')+d.name+' (card)':'Credit card'}return(S.accounts.find(a=>a.id===id)||{name:'(deleted account)'}).name}
function techById(id){return S.techs.find(t=>t.id===id)||{name:'?',pct:0,allow:0,rule:'none'}}

/* ---------- storage & migration ---------- */
function migrate(d){
  const base=defaults();
  if(d.v===2){const o=Object.assign(base,d);o.invest=Object.assign(defaults().invest,d.invest||{});o.plan=Object.assign(defaults().plan,d.plan||{});o.shop=Object.assign(defaults().shop,d.shop||{});o.techs.forEach(t=>{if(t.rule==='nojobs')t.rule='manual'});o.debts.forEach(fixDebt);if(!d.goalFix){o.accounts.forEach(a=>{if(a.kind!=='reserve'&&a.goal>0&&!(+a.opening)&&!o.tx.some(t=>t.acct===a.id||t.to===a.id)){a.opening=a.goal;a.goal=0}});o.goalFix=true}return o}
  const map={'Cash':'cash','GCash':'gcash','Bank':'bank','Credit card':'card'};
  base.tx=(d.tx||[]).map(t=>({id:t.id,date:t.date,type:t.type,amt:t.amt,cat:t.cat,note:t.note,book:'me',acct:map[t.method]||'cash'}));
  base.bills=(d.bills||[]).map(b=>({id:b.id,name:b.name,amt:b.amt,due:b.due,book:'me',freq:'monthly',start:1,cat:b.kind==='sub'?'Subscriptions':'Bills',via:b.via||''}));
  base.debts=(d.debts||[]).map(fixDebt);base.paid=d.paid||{};
  base.plan=Object.assign(base.plan,d.plan||{});base.invest=Object.assign(base.invest,d.invest||{});
  return base;
}
const HAS_CLOUD=!!(window.storage&&typeof window.storage.get==='function');
async function readStore(){
  if(HAS_CLOUD){const r=await window.storage.get(KEY,false);return r&&r.value}
  return localStorage.getItem(KEY);
}
async function writeStore(v){
  if(HAS_CLOUD){const r=await window.storage.set(KEY,v,false);return !!r}
  localStorage.setItem(KEY,v);return true;
}
async function delStore(k){try{if(HAS_CLOUD)await window.storage.delete(k,false);else localStorage.removeItem(k)}catch(e){}}
async function readKey(k){if(HAS_CLOUD){const r=await window.storage.get(k,false);return r&&r.value}return localStorage.getItem(k)}
async function writeKey(k,v){if(HAS_CLOUD){const r=await window.storage.set(k,v,false);return !!r}localStorage.setItem(k,v);return true}
const SNAP_IDX='bantay-pera-snaps';
const SNAP_KEEP={auto:7,manual:10,before:5};
async function snapIndex(){try{const v=await readKey(SNAP_IDX);return v?JSON.parse(v):[]}catch(e){return[]}}
function snapSummary(d){const acc=(d.accounts||[]).reduce((s,a)=>{let b=+a.opening||0;for(const t of d.tx||[]){if(t.type==='in'&&t.acct===a.id)b+=t.amt;else if(t.type==='out'&&t.acct===a.id)b-=t.amt;else if(t.type==='xfer'){if(t.acct===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt}}return s+b},0);
  return{entries:(d.tx||[]).length,total:acc,debts:(d.debts||[]).length}}
async function makeSnap(kind,label,data){
  try{const d=data||S;const id='snap:'+Date.now().toString(36);
    if(!await writeKey(id,JSON.stringify(d)))return false;
    let idx=await snapIndex();idx.unshift({id,kind,label,ts:Date.now(),...snapSummary(d)});
    const drop=[];for(const k of Object.keys(SNAP_KEEP)){const of=idx.filter(x=>x.kind===k);of.slice(SNAP_KEEP[k]).forEach(x=>drop.push(x.id))}
    idx=idx.filter(x=>!drop.includes(x.id));for(const k of drop)await delStore(k);
    await writeKey(SNAP_IDX,JSON.stringify(idx));return true}catch(e){return false}
}
async function dailySnap(){
  const idx=await snapIndex();const last=idx.find(x=>x.kind==='auto');
  if(S.tx.length+S.debts.length+S.bills.length===0)return;
  if(!last||iso(new Date(last.ts))!==todayISO())await makeSnap('auto','Start of '+dayLabel(todayISO()));
}
async function load(){
  try{const v=await readStore();if(v)S=migrate(JSON.parse(v))}catch(e){}
  if(!HAS_CLOUD&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  render();
  dailySnap();
}
let saveTimer;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{
  try{if(!await writeStore(JSON.stringify(S)))toast('Not saved. Copy a backup in Settings.')}
  catch(e){toast('Not saved. Copy a backup in Settings.')}},250)}

/* ---------- calculations ---------- */
function balance(a){
  let b=+a.opening||0;
  for(const t of S.tx){
    if(t.type==='in'&&t.acct===a.id)b+=t.amt;
    else if(t.type==='out'&&t.acct===a.id)b-=t.amt;
    else if(t.type==='xfer'){if(t.acct===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt}
  }
  return b;
}
function inBook(t,book){return t.type!=='xfer'&&(book==='all'||t.book===book)}
function earned(list,book){return sum(list.filter(t=>t.type==='in'&&t.cat!==BORROWED&&!(t.cat===DRAW&&book!=='me')),t=>t.amt)}
function borrowed(list){return sum(list.filter(t=>t.type==='in'&&t.cat===BORROWED),t=>t.amt)}
function spent(list){return sum(list.filter(t=>t.type==='out'&&t.cat!==DRAW),t=>t.amt)}
function draws(list){return sum(list.filter(t=>t.type==='out'&&t.cat===DRAW),t=>t.amt)}
function dueInMonth(b,m){if(b.freq==='monthly'||!b.freq)return true;const mo=+m.slice(5,7);
  if(b.freq==='quarterly')return((mo-b.start)%3+3)%3===0;return mo===+b.start}
function perMonth(b){return b.amt*({monthly:1,quarterly:1/3,yearly:1/12}[b.freq||'monthly'])}
function fixDebt(d){d.kind=d.kind||'card';d.rate=+d.rate||0;if(d.kind==='inst'){d.rate=0;d.min=d.monthly;d.bal=Math.max(0,d.monthly*(d.term-d.paidMonths))}return d}
function debtLeft(d){return d.kind==='inst'?Math.max(0,d.term-d.paidMonths):null}
function debtPaidSoFar(d){return d.kind==='inst'?d.monthly*d.paidMonths:sum(S.tx.filter(t=>t.debt===d.id),t=>t.amt)}
function lastPayMonth(d){const left=debtLeft(d);if(!left)return'';const cm=monthKey(todayISO());const paidNow=!!(S.paid[cm]||{})[d.id];return monthLabel(shiftMonth(cm,paidNow?left:left-1))}
function cardEffect(t,sign){if(!String(t.acct).startsWith('card:'))return;const d=S.debts.find(x=>x.id===t.acct.slice(5));if(!d)return;d.bal=Math.max(0,d.bal+sign*(t.type==='out'?t.amt:-t.amt))}
function undoTx(t){cardEffect(t,-1);if(t.debt){const d=S.debts.find(x=>x.id===t.debt);if(d){if(d.kind==='inst'){d.paidMonths=Math.max(0,d.paidMonths-1);fixDebt(d)}else d.bal+=t.amt}}}
function dueItems(m,book){
  const paid=S.paid[m]||{};
  let items=S.bills.filter(b=>dueInMonth(b,m)&&(book==='all'||b.book===book))
    .map(b=>({id:b.id,name:b.name,amt:b.amt,due:b.due,src:'bill',book:b.book,cat:b.cat,via:b.via,freq:b.freq}));
  if(book==='all'||book==='me')items=items.concat(S.debts.filter(d=>d.bal>0||paid[d.id]).map(d=>({id:d.id,name:d.name,amt:Math.min(d.min,d.bal)||d.min,due:d.due,src:'debt',book:'me',cat:'Debt payment',via:'',inst:d.kind==='inst'})));
  items.forEach(i=>{i.paid=!!paid[i.id];i.pre=!!(paid[i.id]&&paid[i.id].pre)});
  return items.sort((a,b)=>a.due-b.due);
}
function monthlyInterest(){return sum(S.debts,d=>d.bal*d.rate/100)}
function commission(tech,price,parts){if(tech.owner)return 0;const base=S.shop.base==='net'?Math.max(0,price-parts):price;return base*tech.pct/100}
function jobsOn(day){return S.tx.filter(t=>t.job&&t.date===day)}
function techDue(tech,day){
  const jobs=jobsOn(day).filter(t=>t.job.tech===tech.id);
  const comm=sum(jobs,t=>t.job.comm);
  const allow=tech.rule==='always'?tech.allow:0;
  return{jobs,comm,allow,total:comm+allow};
}
function payTx(techId,day){return S.tx.find(t=>t.pay&&t.pay.tech===techId&&t.pay.day===day)}
function repairAdjustTx(day){return S.tx.find(t=>t.repairDay===day)}
function repairBooked(day){return sum(S.tx.filter(t=>t.date===day&&t.type==='in'&&t.book==='fk'&&t.cat==='Repair job'&&!t.repairDay),t=>+t.amt||0)}
function repairReceived(day){const cur=repairAdjustTx(day);return cur&&cur.repairTotal!=null?+cur.repairTotal:repairBooked(day)}
function plainAmt(n){return String(Math.round((+n||0)*100)/100)}
// Day total the user typed. The extra above logged repair payments sits in the shop drawer.
function setRepairReceived(day,total){
  total=Math.round((+total||0)*100)/100;
  const booked=repairBooked(day);
  if(total<booked-0.001)return 'low';
  const cur=repairAdjustTx(day);
  const delta=Math.round((total-booked)*100)/100;
  if(delta<=0.001){if(cur)S.tx=S.tx.filter(t=>t.repairDay!==day);return cur?'saved':'same'}
  if(cur){if(Math.abs(cur.amt-delta)<0.001&&cur.repairTotal===total&&cur.date===day)return 'same';cur.amt=delta;cur.repairTotal=total;cur.date=day;cur.acct='drawer';return 'saved'}
  S.tx.push({id:uid(),type:'in',amt:delta,book:'fk',cat:'Repair job',acct:'drawer',date:day,note:'Repairs received',repairDay:day,repairTotal:total});
  return 'saved';
}
function applyRepairReceived(day){
  const cur=repairAdjustTx(day);if(!cur||cur.repairTotal==null)return false;
  const delta=Math.round((+cur.repairTotal-repairBooked(day))*100)/100;
  if(delta<=0.001){S.tx=S.tx.filter(t=>t.repairDay!==day);return true}
  if(Math.abs(cur.amt-delta)<0.001&&cur.acct==='drawer')return false;
  cur.amt=delta;cur.acct='drawer';return true;
}
function repairSourceAcct(day){
  const by={};
  S.tx.filter(t=>t.date===day&&t.type==='in'&&t.book==='fk'&&t.cat==='Repair job').forEach(t=>{by[t.acct]=(by[t.acct]||0)+t.amt});
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  return top?top[0]:'drawer';
}
function simulate(extra,method){
  const ds=S.debts.filter(d=>d.bal>0).map(d=>({name:d.name,b:+d.bal,rate:+d.rate||0,min:+d.min,inst:d.kind==='inst'}));
  if(!ds.length)return{months:0,interest:0,done:true,order:[]};
  const budget=sum(ds,d=>d.min)+extra;let months=0,interest=0;const order=[];
  while(ds.some(d=>d.b>0.5)&&months<600){months++;
    ds.forEach(d=>{if(d.b>0&&!d.inst){const i=d.b*d.rate/100;d.b+=i;interest+=i}});
    let left=budget;ds.forEach(d=>{if(d.b>0){const p=Math.min(d.min,d.b,left);d.b-=p;left-=p}});
    let tg=ds.filter(d=>d.b>0&&!d.inst);if(!tg.length)tg=ds.filter(d=>d.b>0);
    tg.sort(method==='avalanche'?(a,b)=>b.rate-a.rate||a.b-b.b:(a,b)=>a.b-b.b);
    for(const d of tg){if(left<=0)break;const p=Math.min(left,d.b);d.b-=p;left-=p}
    ds.forEach(d=>{if(d.b<=0.5&&!order.find(o=>o.name===d.name))order.push({name:d.name,month:months})});}
  return{months,interest,done:!ds.some(d=>d.b>0.5),order};
}
function inMonths(n){const d=new Date();d.setMonth(d.getMonth()+n);return d.toLocaleDateString('en-PH',{month:'short',year:'numeric'})}
function buyFees(a){const comm=Math.max(a*0.0025,S.invest.minComm);return comm*1.12+a*0.00005+a*0.0001}
function buyThreshold(){let a=500;while(a<200000&&buyFees(a)/a>0.01)a+=50;return a}

/* ---------- shared bits ---------- */
function bookChips(cur,act,withAll=true){
  const list=(withAll?[{id:'all',name:'All'}]:[]).concat(S.books);
  return `<div class="chips scroll">`+list.map(b=>`<button class="chip" aria-pressed="${cur===b.id}" data-act="${act}" data-b="${b.id}">${esc(b.name)}</button>`).join('')+`</div>`;
}
function catBars(list){
  const c={};list.filter(t=>t.type==='out'&&t.cat!==DRAW).forEach(t=>c[t.cat]=(c[t.cat]||0)+t.amt);
  const e=Object.entries(c).sort((x,y)=>y[1]-x[1]);if(!e.length)return'';const mx=e[0][1];
  return e.map(([k,v])=>`<div class="cat"><span>${esc(k)}</span><b>${peso(v)}</b><div class="track"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div></div>`).join('');
}
function txRow(t){
  if(t.type==='xfer')return `<li><div class="main"><div class="name">${esc(t.note||'Moved money')}</div><div class="meta">${dayLabel(t.date)} · ${esc(acctName(t.acct))} to ${esc(acctName(t.to))}</div></div><span class="amt">${peso(t.amt)}</span><button class="btn small ghost" data-act="deltx" data-id="${t.id}" aria-label="Delete">✕</button></li>`;
  const extra=t.job?` · ${esc(techById(t.job.tech).name)}${t.job.parts?' · parts '+peso(t.job.parts):''}`:'';
  return `<li><div class="main"><div class="name">${esc(t.note||t.cat)}</div><div class="meta">${dayLabel(t.date)} · ${esc(bookName(t.book))} · ${esc(t.cat)} · ${esc(acctName(t.acct))}${extra}</div></div>

}

function periodRange(){
  const t=new Date(),today=todayISO();
  if(period==='day')return[today,today];
  if(period==='week'){const d=new Date(t);d.setDate(d.getDate()-(d.getDay()+6)%7);const e=new Date(d);e.setDate(d.getDate()+6);return[iso(d),iso(e)]}
  if(period==='month'){const m=monthKey(today);return[m+'-01',m+'-31']}
  return['0000','9999'];
}

    return `<li><div class="main"><div class="name">${esc(d.name)}</div><div class="meta">${lender}${d.rate}%/mo · min ${peso(d.min)} · due ${d.due} · interest ${peso(d.bal*d.rate/100)}/mo</div>${paid?`<div class="meta">Paid so far ${peso(paid)}</div>`:''}</div>
    <span class="amt ${d.bal>0?'neg':'pos'}">${d.bal>0?peso(d.bal):'Paid off'}</span>${d.bal>0?`<button class="btn small" data-act="paydebt" data-id="${d.id}">Pay</button>`:''}<button class="btn small ghost" data-act="editdebt" data-id="${d.id}">Edit</button></li>`}).join('')+`</ul></section>`;
  if(live.length){const p=S.plan;const base=simulate(0,p.method),hun=simulate(3000,p.method),mine=simulate(p.extra,p.method);
    const f=r=>r.done?`${r.months} mo`:'never',fi=r=>r.done?peso(r.interest):'—';
    h+=`<section class="panel"><h3>Payoff plan</h3>
    <div class="seg-toggle"><button class="neutral" aria-pressed="${p.method==='avalanche'}" data-act="method" data-m="avalanche">Highest interest first</button><button class="neutral" aria-pressed="${p.method==='snowball'}" data-act="method" data-m="snowball">Smallest balance first</button></div>
    <label class="field"><span>Extra I can pay on top of minimums, per month</span><input inputmode="decimal" id="extra" value="${p.extra||''}" placeholder="0"></label>
    <div class="scen"><span class="h">Plan</span><span class="h">Debt-free</span><span class="h">Interest paid</span>
    <span>Required payments only</span><b>${f(base)}</b><b>${fi(base)}</b><span>+ ₱100 a day</span><b>${f(hun)}</b><b>${fi(hun)}</b><span>+ your extra</span><b>${f(mine)}</b><b>${fi(mine)}</b></div>`;
    if(!base.done)h+=`<p class="callout red" style="margin-top:12px">At minimums only, interest grows faster than your payments. Some extra every month is the only way out.</p>`;
    if(mine.done&&mine.order.length)h+=`<div class="groupname">Order with your plan</div><ul class="list">`+mine.order.map(o=>`<li><div class="main"><div class="name">${esc(o.name)}</div></div><span class="meta">paid by ${inMonths(o.month)}</span></li>`).join('')+`</ul>`;
    if(base.done&&hun.done)h+=`<p class="callout green" style="margin-top:12px">₱100 a day on debt saves about <b>${peso(base.interest-hun.interest)}</b> in interest.</p>`;
    h+=`</section>`}
  return h;
}

function vInvest(){
  const I=S.invest;const debt=sum(S.debts.filter(d=>d.bal>0),d=>d.bal);
  const thr=buyThreshold(),fee=I.jar>0?buyFees(I.jar):0;
  const mo=I.daily*30,r=I.rate/100/12,n=I.years*12,fv=r?mo*((Math.pow(1+r,n)-1)/r):mo*n;
  const res=S.accounts.filter(a=>a.kind==='reserve');const resBal=sum(res,balance),resGoal=sum(res,a=>a.goal||0);
  let h='';
  if(debt>0)h+=`<section class="callout red"><p><b>Cards first.</b> You owe ${peso(debt)}. Stocks rarely beat card interest. Plan here, start buying once balances are gone.</p></section>`;
  else if(resGoal&&resBal<resGoal)h+=`<section class="callout"><p><b>Emergency fund next.</b> ${peso(resBal)} of ${peso(resGoal)}. Fill it before buying stocks.</p></section>`;
  h+=`<section class="panel"><h3>Savings jar</h3><div class="big">${peso(I.jar)}</div>
  <p class="hint">${I.jar>=thr?`Ready to buy. Fees about ${peso(fee,1)} (${(fee/I.jar*100).toFixed(2)}%).`:`Buy once it reaches ${peso(thr)}, where fees drop under 1%.`}</p>
  <div class="chips" style="margin-top:10px"><button class="btn small" data-act="jar" data-v="${I.daily}">Add ${peso(I.daily)}</button><button class="btn small" data-act="jarcustom">Add amount</button><button class="btn small" data-act="jarout">Take out</button></div></section>
  <section class="panel"><h3>Projection</h3>

  <div class="two"><label class="field"><span>Yearly return %</span><input inputmode="decimal" data-inv="rate" value="${I.rate}"></label><label class="field"><span>Broker min. commission</span><input inputmode="decimal" data-inv="minComm" value="${I.minComm}"></label></div>
  <p style="margin:0">${peso(mo)}/month for ${I.years} years at ${I.rate}% could grow to about <b>${peso(fv)}</b>. You'd put in ${peso(mo*n)}.</p><p class="hint">Not guaranteed. Check GStocks' real fees.</p></section>
  <section class="panel"><h3>My stocks</h3>`+(I.holdings.length?`<ul class="list">`+I.holdings.map(x=>`<li><div class="main"><div class="name">${esc(x.sym)}</div><div class="meta">${x.shares.toLocaleString()} shares · avg ${peso(x.cost/x.shares,1)}</div></div><span class="amt">${peso(x.cost)}</span><button class="btn small ghost" data-act="delhold" data-sym="${esc(x.sym)}" aria-label="Remove">✕</button></li>`).join('')+`</ul>`:`<p class="empty">No buys recorded yet.</p>`)+

    pay:()=>payDialog(id),unpay:()=>unpay(id),prepaidall:prepaidAll,period:()=>{period=b.dataset.p;render()},
    addtx:txDialog,xfer:xferDialog,setbal:()=>setBalDialog(id),
    deltx:()=>{if(!confirm('Delete this entry?'))return;const tt=S.tx.find(t=>t.id===id);if(tt)undoTx(tt);S.tx=S.tx.filter(t=>t.id!==id);for(const m in S.paid)for(const k in S.paid[m])if(S.paid[m][k].tx===id)delete S.paid[m][k];save();render()},
    addjob:jobDialog,addparts:partsDialog,draw:drawDialog,paytech:()=>payTechDialog(id),
    addbill:()=>billDialog(),editbill:()=>billDialog(id),shopbills:addShopBills,
    download:()=>{try{S.lastDownload=Date.now();save();const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bantay-pera-backup-'+todayISO()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup file saved to Downloads');render()}catch(_){toast('Download not available here. Use Copy backup.')}},
    adddebt:()=>debtDialog(),paydebt:()=>payDebtDialog(id),editdebt:()=>debtDialog(id),method:()=>{S.plan.method=b.dataset.m;save();render()},
    jar:()=>{S.invest.jar+=num(b.dataset.v);save();render();toast('Added to jar')},
    jarcustom:()=>amountDialog('Add to jar',v=>{S.invest.jar+=v;save();render()}),
    jarout:()=>amountDialog('Take out of jar',v=>{S.invest.jar=Math.max(0,S.invest.jar-v);save();render()}),
    buy:buyDialog,delhold:()=>{if(confirm('Remove this stock?')){S.invest.holdings=S.invest.holdings.filter(x=>x.sym!==b.dataset.sym);save();render()}},
    closeset:()=>{tab=prevTab;render()},editacct:()=>acctDialog(id),addacct:()=>acctDialog(),edittech:()=>techDialog(id),addtech:()=>techDialog(),
    editbook:()=>bookDialog(id),addbook:()=>bookDialog(),base:()=>{S.shop.base=b.dataset.v;save();render()},
    export:()=>{const txt=JSON.stringify(S);openDlg(`<h2>Backup</h2><p class="hint" style="margin:0 0 8px">Copy everything below and keep it in your notes.</p><textarea id="bk" readonly>${esc(txt)}</textarea><div class="actions"><button class="btn" data-close>Close</button><button class="btn primary" id="cp">Copy</button></div>`);
      $('cp').addEventListener('click',async()=>{$('bk').select();try{await navigator.clipboard.writeText(txt)}catch(_){document.execCommand('copy')}toast('Backup copied')})},
    import:()=>openDlg(`<h2>Restore backup</h2><p class="hint" style="margin:0 0 8px">Paste a backup. This replaces what's in the app now.</p><textarea id="bk"></textarea>${btns('Restore')}`,
      ()=>{let d;try{d=JSON.parse(val('bk'));if(!Array.isArray(d.tx))throw 0}catch(_){toast('That backup text is not valid');return false}restoreData(d,'Restore backup')}),
    reset:()=>{if(confirm('Erase everything? A restore point is saved first so you can undo this.'))restoreData(defaults(),'Erase all')},
    snapnow:()=>openDlg(`<h2>Save restore point</h2><label class="field"><span>Name (optional)</span><input id="nm" placeholder="e.g. All balances checked"></label>${btns('Save')}`,
      ()=>{makeSnap('manual',val('nm').trim()||'Saved by me').then(ok=>{toast(ok?'Restore point saved':'Could not save. Download a backup file instead.');render()})}),
    snaprestore:async()=>{const idx=await snapIndex();const x=idx.find(y=>y.id===id);if(!x)return;
      if(!confirm(`Go back to "${x.label}"? Your current data is saved as a restore point first.`))return;
      try{const d=JSON.parse(await readKey(id));await restoreData(d,'Restore point')}catch(_){toast('That restore point could not be read')}},
    snapdel:async()=>{if(!confirm('Delete this restore point?'))return;let idx=await snapIndex();idx=idx.filter(y=>y.id!==id);await delStore(id);await writeKey(SNAP_IDX,JSON.stringify(idx));renderSnaps()},
    openfile:()=>{const f=document.getElementById('bkfile');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();
      r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0}catch(_){toast('That file is not a Bantay Pera backup');return}
        if(confirm('Load this backup file? Your current data is saved as a restore point first.'))restoreData(d,'Load backup file')};r.readAsText(file)};f.click()}
  };
  A[a]&&A[a]();
});
document.getElementById('view').addEventListener('change',e=>{
  if(e.target.id==='extra'){S.plan.extra=num(e.target.value);save();render()}
  else if(e.target.id==='shopday'&&e.target.value){shopDay=e.target.value;render()}
  else if(e.target.id==='repairday'){const r=setRepairReceived(shopDay,num(e.target.value));
    if(r==='low'){toast('Logged repairs are already '+peso(repairBooked(shopDay)));e.target.value=plainAmt(repairReceived(shopDay));return}
    if(r==='saved'){save();toast('Repairs received saved');setTimeout(render,0)}}
  else if(e.target.id==='deliv'){S.shop.delivery=num(e.target.value);save()}
  const k=e.target.dataset.inv;if(k){S.invest[k]=num(e.target.value);save();render()}
});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')dailySnap()});
load();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
